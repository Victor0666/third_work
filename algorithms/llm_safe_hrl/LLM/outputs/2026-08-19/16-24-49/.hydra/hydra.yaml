hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - problem=cews_task_constructive
    - max_fe=10
    - pop_size=10
    - init_pop_size=10
    - temperature=1
    - timeout=300
    - parameter_optimization.population_size=6
    - parameter_optimization.max_generations=4
    - parameter_optimization.max_parallel_evaluations=18
    - counterfactual_feedback.max_structures_per_generation=2
    - protocol=single
    - source_scenario=SL
    - +deadline_cache_paths.SL=data/deadlines/fcfs/diagnostic/fcfs_fixed_SL_exactmix_formal38.json
    - +deadline_cache_paths.ML=data/deadlines/fcfs/diagnostic/fcfs_fixed_ML_exactmix_formal38.json
    - +deadline_cache_paths.LL=data/deadlines/fcfs/diagnostic/fcfs_fixed_LL_exactmix_formal38.json
    - problem.dataset.deadline_alpha_small_prob=0.2
  job:
    name: main
    chdir: true
    override_dirname: +deadline_cache_paths.LL=data/deadlines/fcfs/diagnostic/fcfs_fixed_LL_exactmix_formal38.json,+deadline_cache_paths.ML=data/deadlines/fcfs/diagnostic/fcfs_fixed_ML_exactmix_formal38.json,+deadline_cache_paths.SL=data/deadlines/fcfs/diagnostic/fcfs_fixed_SL_exactmix_formal38.json,counterfactual_feedback.max_structures_per_generation=2,init_pop_size=10,max_fe=10,parameter_optimization.max_generations=4,parameter_optimization.max_parallel_evaluations=18,parameter_optimization.population_size=6,pop_size=10,problem.dataset.deadline_alpha_small_prob=0.2,problem=cews_task_constructive,protocol=single,source_scenario=SL,temperature=1,timeout=300
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: E:\读博生活\0.科研\1.论文\3. 第三个任务\2. 论文实验材料\sec_job\algorithms\llm_safe_hrl\LLM
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: E:\读博生活\0.科研\1.论文\3. 第三个任务\2. 论文实验材料\sec_job\algorithms\llm_safe_hrl\LLM\cfg
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: E:\读博生活\0.科研\1.论文\3. 第三个任务\2. 论文实验材料\sec_job\algorithms\llm_safe_hrl\LLM\outputs\2026-08-19\16-24-49
    choices:
      problem: cews_task_constructive
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
