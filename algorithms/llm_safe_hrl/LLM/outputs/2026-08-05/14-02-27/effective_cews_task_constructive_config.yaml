problem_name: cews_task_constructive
problem_type: constructive
obj_type: min
problem_size: 50
func_name: get_task_priority
description: 'Dynamic deadline-aware cloud-edge workflow scheduling. Workflows are
  represented as DAGs. At each decision point, the heuristic ranks all currently ready
  tasks. After one task is selected, a deterministic resource-selection policy assigns
  it to a feasible cloud or edge VM. The objective is to minimize risk-adjusted fuzzy
  total energy subject to hard workflow deadline constraints.

  '
objective:
  metric: total_energy
constraints:
  deadline_violation_rate_max: 0.0
  comparison: feasibility_first
fuzzy:
  enabled: true
  delta1: 0.75
  delta2: 1.2
  energy_uncertainty_weight: 1.0
  deadline_eta: 0.95
  use_fuzzy_deadline_constraint: true
  resource_seed_mode: episode_seed
  resource_seed_offset: 0
normalization:
  energy_scale: 0.001
  lateness_scale: 300.0
dataset:
  scenario: SS
  train_seeds:
  - 0
  - 1
  - 2
  validation_seeds:
  - 3
  - 4
  test_seeds:
  - 100
  dax_files:
  - CyberShake_30.xml
  - Epigenomics_24.xml
  - Ligo_30.xml
  - Montage_25.xml
  - Sipht_29.xml
  workflows_per_instance: 50
  arrival_lambda: 0.03
  horizon: 1000000000.0
  deadline_mode: cache_fcfs
  deadline_alpha_small: 2.0
  deadline_alpha_large: 3.0
  deadline_alpha_small_prob: 0.8
resources:
  num_cloud_hosts: 3
  num_edge_hosts: 2
  cloud_vms_per_host:
  - 9
  - 8
  - 6
  edge_vms_per_host:
  - 8
  - 6
  cloud_pc_tiers:
  - 1.0
  - 2.0
  - 4.0
  - 6.0
  - 8.0
  edge_pc_tiers:
  - 1.0
  - 2.0
  - 4.0
  - 6.0
  - 8.0
  cloud_bw_tiers:
  - 1000.0
  - 2000.0
  - 4000.0
  - 6000.0
  - 8000.0
  edge_bw_tiers:
  - 1000.0
  - 2000.0
  - 4000.0
  - 6000.0
  - 8000.0
safety:
  max_decisions: 1000000
  max_stalled_steps: 10
