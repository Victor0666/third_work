problem_name: cews_task_constructive
problem_type: constructive
obj_type: min
problem_size: 50
func_name: get_task_priority
description: 'Dynamic deadline-aware cloud-edge workflow scheduling. Workflows are
  represented as DAGs. At each decision point, the heuristic ranks all currently ready
  tasks. After one task is selected, a deterministic resource-selection policy assigns
  it to a feasible cloud or edge VM. The objective is to minimize risk-adjusted fuzzy
  total energy subject to hard workflow deadline constraints.

  '
objective:
  metric: total_energy
constraints:
  deadline_violation_rate_max: 0.0
  comparison: feasibility_first
fuzzy:
  enabled: true
  delta1: 0.75
  delta2: 1.2
  energy_uncertainty_weight: 1.0
  deadline_eta: 0.95
  use_fuzzy_deadline_constraint: true
  resource_seed_mode: episode_seed
  resource_seed_offset: 0
normalization:
  energy_scale: 0.001
  lateness_scale: 300.0
